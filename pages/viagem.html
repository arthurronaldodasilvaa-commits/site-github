<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💌 Mensagens do Arthur — Para a Mari</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/viagem.css" />
</head>
<body>

  <!-- Fundo com blobs -->
  <div class="viagem-ambient">
    <div class="va-blob va-blob-1"></div>
    <div class="va-blob va-blob-2"></div>
    <div class="va-blob va-blob-3"></div>
  </div>

  <!-- Header -->
  <header class="viagem-header">
    <a class="btn-back" href="../board.html">← voltar</a>
    <span class="header-label">enquanto estou longe ✈️</span>
  </header>

  <!-- Conteúdo -->
  <main class="viagem-main">

    <div class="viagem-intro">
      <span class="intro-emoji">💌</span>
      <p class="intro-text">
        Ei Mari… tô longe mas<br>
        deixei um <strong>eu te amo</strong> pra cada dia
      </p>
    </div>

    <!-- Cartões dos dias (renderizados por JS) -->
    <div class="days-list" id="days-list"></div>

    <p class="viagem-note">
      Volto na segunda pra te abraçar muito 🌷<br>
      — Arthur
    </p>

  </main>

  <script src="../js/config.js"></script>
  <script src="../js/viagem.js?v=2"></script>
</body>
</html>
